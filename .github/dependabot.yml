version: 2

updates:
  # GitHub Actions — check weekly for action version updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      all-dependencies:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm — frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      all-dependencies:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Cargo — Rust backend dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      all-dependencies:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # zbus 6 deferred: tauri-plugin-single-instance requires zbus 5; revisit when it supports zbus 6
    ignore:
      - dependency-name: "zbus"
        update-types: ["version-update:semver-major"]
