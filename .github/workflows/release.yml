name: Release Build

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Git tag to build (e.g. v0.5.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to build (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

# Required secrets in the "public" GitHub environment:
#
# macOS code signing & notarization:
#   APPLE_CERTIFICATE            — Base64-encoded .p12 Developer ID Application certificate
#   APPLE_CERTIFICATE_PASSWORD   — Password for the .p12 file
#   APPLE_ID                     — Apple ID email for notarization
#   APPLE_PASSWORD               — App-specific password (appleid.apple.com → Security)
#   APPLE_TEAM_ID                — 10-character Apple Developer Team ID
#
# Required variables in the "public" GitHub environment:
#   APPLE_SIGNING_IDENTITY       — e.g. "Developer ID Application: Your Name (TEAM_ID)"
#
# Updater signing:
#   TAURI_SIGNING_PRIVATE_KEY          — Ed25519 private key for signing updater bundles
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — Password for the signing key

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - name: Find or create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG_NAME"
            exit 1
          fi

          if release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq .id 2>&1); then
            echo "Found release $release_id for $TAG_NAME"
          elif [[ "$release_id" == *"HTTP 404"* ]]; then
            release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f "tag_name=$TAG_NAME" \
              -f "name=Stay Awake $TAG_NAME" \
              -F draft=false \
              -F prerelease=false \
              --jq .id)
            echo "Created release $release_id for $TAG_NAME"
          else
            printf '%s\n' "$release_id" >&2
            exit 1
          fi

          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 60
    environment: public
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.99.1
          cache-workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Cargo registry & target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-macos-latest-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            release-cargo-macos-latest-

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Prepend new keychain to search list (don't replace existing ones)
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tagName: ${{ inputs.tag_name }}
          uploadUpdaterJson: true
          args: --verbose

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12 2>/dev/null || true

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    outputs:
      linux-build-failed: ${{ steps.tauri.outcome != 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.99.1
          cache-workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Cargo registry & target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-ubuntu-24.04-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            release-cargo-ubuntu-24.04-

      - name: Install Linux dependencies
        run: scripts/install-linux-dependencies.sh

      - name: Build and upload release assets
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_LINUX_AYATANA_APPINDICATOR: true
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tagName: ${{ inputs.tag_name }}
          uploadUpdaterJson: false
          args: --verbose

  report-linux:
    name: Report Linux build
    if: always()
    needs: [build-linux]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Summarize Linux build
        env:
          LINUX_FAILED: ${{ needs.build-linux.outputs.linux-build-failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$LINUX_FAILED" == true ]]; then
            echo "## Linux build failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Linux .deb build failed. The release and Homebrew distribution continued. See $RUN_URL." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Linux .deb build failed. The release and Homebrew distribution continued. See $RUN_URL."
          elif [[ -z "$LINUX_FAILED" ]]; then
            echo "## Linux build did not report a result" >> "$GITHUB_STEP_SUMMARY"
            echo "Linux build did not report a result. See $RUN_URL." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Linux build did not report a result. See $RUN_URL."
          else
            echo "## Linux build" >> "$GITHUB_STEP_SUMMARY"
            echo "Linux .deb build succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi
